name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x
      - run: dotnet restore backend.csproj
        working-directory: backend
      - run: dotnet build backend.csproj --no-restore --configuration Release
        working-directory: backend
      - run: dotnet test backend.Tests.csproj --configuration Release
        working-directory: backend.Tests
      - run: dotnet list backend.csproj package --vulnerable --include-transitive
        working-directory: backend
      - run: dotnet list backend.Tests.csproj package --vulnerable --include-transitive
        working-directory: backend.Tests
