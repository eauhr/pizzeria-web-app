services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=db;Database=PizzeriaDb;User Id=sa;Password=${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD};TrustServerCertificate=True"
      Jwt__Issuer: Picantino.Api
      Jwt__Audience: Picantino.Web
      Jwt__Key: ${JWT_KEY:?Set JWT_KEY to a random key of at least 32 bytes}
    ports:
      - "5127:8080"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

volumes:
  sqlserver-data:
